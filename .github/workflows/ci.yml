name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies (annotation)
        working-directory: annotation
        run: dart pub get

      - name: Install dependencies (dataforge_base)
        working-directory: dataforge_base
        run: dart pub get

      - name: Install dependencies (cli)
        working-directory: cli
        run: dart pub get

      - name: Install dependencies (generator)
        working-directory: generator
        run: dart pub get

      - name: Analyze annotation
        working-directory: annotation
        run: dart analyze --fatal-infos

      - name: Analyze dataforge_base
        working-directory: dataforge_base
        run: dart analyze --fatal-infos

      - name: Analyze cli
        working-directory: cli
        run: dart analyze --fatal-infos

      - name: Analyze generator
        working-directory: generator
        run: dart analyze --fatal-infos

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check format (annotation)
        working-directory: annotation
        run: dart format --output=none --set-exit-if-changed .

      - name: Check format (dataforge_base)
        working-directory: dataforge_base
        run: dart format --output=none --set-exit-if-changed .

      - name: Check format (cli)
        working-directory: cli
        run: dart format --output=none --set-exit-if-changed lib bin test example

      - name: Check format (generator)
        working-directory: generator
        run: dart format --output=none --set-exit-if-changed lib test example

  package:
    name: Package dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Test publish dry-run validator
        run: dart run tool/validate_publish_dry_run_test.dart

      - name: Validate annotation package
        working-directory: annotation
        run: dart run ../tool/validate_publish_dry_run.dart

      - name: Validate dataforge_base package
        working-directory: dataforge_base
        run: dart run ../tool/validate_publish_dry_run.dart

      - name: Validate generator package
        working-directory: generator
        run: >-
          dart run ../tool/validate_publish_dry_run.dart
          dataforge_annotation dataforge_base

      - name: Validate CLI package
        working-directory: cli
        run: >-
          dart run ../tool/validate_publish_dry_run.dart
          dataforge_annotation dataforge_base

  test:
    name: Test (${{ matrix.os }}, Dart ${{ matrix.dart }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dart: stable
          - os: ubuntu-latest
            dart: 3.9.0
          - os: macos-latest
            dart: stable
          - os: windows-latest
            dart: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart }}

      - name: Install dependencies (annotation)
        working-directory: annotation
        run: dart pub get

      - name: Install dependencies (dataforge_base)
        working-directory: dataforge_base
        run: dart pub get

      - name: Install dependencies (cli)
        working-directory: cli
        run: dart pub get

      - name: Install dependencies (generator)
        working-directory: generator
        run: dart pub get

      - name: Test annotation
        working-directory: annotation
        run: dart test

      - name: Test dataforge_base
        working-directory: dataforge_base
        run: dart test

      - name: Test cli
        working-directory: cli
        run: dart test

      - name: Test generator
        working-directory: generator
        run: dart test

  example:
    name: Examples from clean output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install example dependencies
        working-directory: generator/example
        run: dart pub get

      - name: Generate example outputs
        working-directory: generator/example
        run: dart run build_runner build

      - name: Analyze example
        working-directory: generator/example
        run: dart analyze --fatal-infos

      - name: Test example
        working-directory: generator/example
        run: dart test

      - name: Install CLI example dependencies
        working-directory: cli/example
        run: dart pub get

      - name: Generate CLI example output
        working-directory: cli/example
        run: dart run dataforge_cli:dataforge_cli generate .

      - name: Analyze CLI example
        working-directory: cli/example
        run: dart analyze --fatal-infos

      - name: Run CLI example
        working-directory: cli/example
        run: dart run bin/main.dart

      - name: Check CLI example output
        working-directory: cli/example
        run: dart run dataforge_cli:dataforge_cli check .
