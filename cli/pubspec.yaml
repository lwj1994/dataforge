name: dataforge_cli
description: Resolved CLI code generation for immutable Dataforge v1 value objects.
version: 1.0.0-dev.0
homepage: https://github.com/lwj1994/dataforge
repository: https://github.com/lwj1994/dataforge
issue_tracker: https://github.com/lwj1994/dataforge/issues
documentation: https://github.com/lwj1994/dataforge#readme

executables:
  dataforge: dataforge_cli

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  analyzer: ^8.1.1
  dart_style: ^3.1.3
  crypto: ^3.0.6
  path: ^1.7.0
  args: ^2.7.0
  dataforge_annotation: 1.0.0-dev.0
  dataforge_base: 1.0.0-dev.0

dev_dependencies:
  test: ^1.25.15
